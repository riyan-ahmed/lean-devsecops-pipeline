name: Lean DevSecOps Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-analyze:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test application
        run: ./mvnw -B clean verify

      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=zm24acgRiyan_Lean-DevSecOps \
            -Dsonar.organization=zm24acgriyan \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Set up Node.js for Snyk
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Snyk CLI
        run: npm install --global snyk@1.1306.2

      - name: Run Snyk dependency scan
        id: snyk_scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk --version
          snyk test --all-projects \
            --severity-threshold=high \
            --json-file-output=snyk.json \
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk reports
        if: always() && hashFiles('snyk.json', 'snyk.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: snyk-scan-reports
          path: |
            snyk.json
            snyk.sarif
          if-no-files-found: warn

      - name: Upload Snyk results to GitHub Security
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-sca

      - name: Build Docker image
        run: |
          docker build \
            -t lean-devsecops-pipeline:${{ github.sha }} \
            .

      - name: Scan Docker image with Trivy
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lean-devsecops-pipeline:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always() && hashFiles('trivy.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: trivy-scan-report
          path: trivy.sarif
          if-no-files-found: warn

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Enforce security gates
        if: always()
        shell: bash
        run: |
          gate_failed=0

          if [[ "${{ steps.snyk_scan.outcome }}" == "failure" ]]; then
            echo "::error::Snyk detected a high or critical dependency vulnerability, or the scan failed."
            gate_failed=1
          fi

          if [[ "${{ steps.trivy_scan.outcome }}" == "failure" ]]; then
            echo "::error::Trivy detected a high or critical container vulnerability, or the scan failed."
            gate_failed=1
          fi

          if [[ "$gate_failed" -ne 0 ]]; then
            echo "Security policy failed. Review the uploaded Snyk and Trivy reports."
            exit 1
          fi

          echo "All security gates passed."
