name: DevSecOps Demo (Clean vs Vulnerable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  clean-build:
    runs-on: ubuntu-latest
    name: Clean Build (Secure Dependencies)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build and Test (Clean POM)
        run: ./mvnw -B verify --file pom-clean.xml

      # Coverage evidence
      - name: Upload Jacoco Coverage Report (Clean)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-clean-report
          path: target/site/jacoco/

      # SonarCloud analysis
      - name: SonarCloud Analysis (Clean)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar --file pom-clean.xml \
            -Dsonar.projectKey=riyan_clean_demo \
            -Dsonar.organization=riyan-org \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # Snyk SCA
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master
      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"
      - name: Run Snyk SCA (Clean)
        continue-on-error: true
        run: snyk test --file=pom-clean.xml --severity-threshold=high \
          --json-file-output=snyk-clean.json \
          --sarif-file-output=snyk-clean.sarif
      - name: Upload Snyk SARIF (Clean)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-clean.sarif
      - name: Pass if no vulnerabilities (Clean)
        run: |
          if grep -Eq '"severity": "(high|critical)"' snyk-clean.json; then
            echo "Unexpected vulnerabilities found in clean build!"
            exit 1
          else
            echo "No high/critical vulnerabilities found. Clean pipeline passes."
          fi

      # Trivy container scan (non-blocking)
      - name: Build Docker Image (Clean)
        run: docker build -t myapp-clean:latest .
      - name: Scan Docker Image with Trivy (Clean)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp-clean:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-clean.sarif
          exit-code: 0
          ignore-unfixed: true
      - name: Upload Trivy SARIF (Clean)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-clean.sarif

  vulnerable-build:
    runs-on: ubuntu-latest
    name: Vulnerable Build (Log4j Failure)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build and Test (Vulnerable POM)
        run: ./mvnw -B verify --file pom-vulnerable.xml

      # Coverage evidence
      - name: Upload Jacoco Coverage Report (Vulnerable)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-vuln-report
          path: target/site/jacoco/

      # SonarCloud analysis
      - name: SonarCloud Analysis (Vulnerable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar --file pom-vulnerable.xml \
            -Dsonar.projectKey=riyan_vuln_demo \
            -Dsonar.organization=riyan-org \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # Snyk SCA
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master
      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth "$SNYK_TOKEN"
      - name: Run Snyk SCA (Vulnerable)
        continue-on-error: true
        run: snyk test --file=pom-vulnerable.xml --severity-threshold=high \
          --json-file-output=snyk-vuln.json \
          --sarif-file-output=snyk-vuln.sarif
      - name: Upload Snyk SARIF (Vulnerable)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-vuln.sarif
      - name: Fail if vulnerabilities found (Vulnerable)
        run: |
          if grep -Eq '"severity": "(high|critical)"' snyk-vuln.json; then
            echo "High/critical vulnerabilities found (Log4j CVE-2021-44228). Failing pipeline."
            exit 1
          else
            echo "No high/critical vulnerabilities found. Vulnerable pipeline passes unexpectedly."
          fi

      # Trivy container scan (non-blocking)
      - name: Build Docker Image (Vulnerable)
        run: docker build -t myapp-vuln:latest .
      - name: Scan Docker Image with Trivy (Vulnerable)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp-vuln:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-vuln.sarif
          exit-code: 0
          ignore-unfixed: true
      - name: Upload Trivy SARIF (Vulnerable)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-vuln.sarif