name: Java CI with Maven (SAST + Snyk SCA + Trivy Docker Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      IMAGE_NAME: "myapp"
      # Set to "true" if you want Trivy/Snyk to fail the pipeline on findings
      ENFORCE_SECURITY: "false"

    steps:
      # --- 1) Checkout ---
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- 2) Setup Java ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      # --- 3) Cache SonarCloud packages ---
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      # --- 4) Make mvnw executable ---
      - name: Make mvnw executable
        run: chmod +x mvnw

      # --- 5) Build + Test + Coverage (JaCoCo runs in verify phase) ---
      - name: Build and Test with Maven
        run: ./mvnw -B clean verify

      # --- 6) SonarCloud Analysis (SAST) ---
      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=zm24acgRiyan_Lean-DevSecOps \
            -Dsonar.organization=zm24acgriyan \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # --- 7) Snyk Setup ---
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # --- 8) Run Snyk SCA (JSON + SARIF) ---
      - name: Run Snyk SCA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "Running Snyk test..."
          if [ "${ENFORCE_SECURITY}" = "true" ]; then
            snyk test --all-projects \
              --severity-threshold=high \
              --json-file-output=snyk.json \
              --sarif-file-output=snyk.sarif
          else
            snyk test --all-projects \
              --severity-threshold=high \
              --json-file-output=snyk.json \
              --sarif-file-output=snyk.sarif || true
          fi

      # --- 9) Upload Snyk artifacts ---
      - name: Upload Snyk Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-scan-reports
          path: |
            snyk.json
            snyk.sarif

      # --- 10) Upload Snyk SARIF to GitHub Security Tab ---
      - name: Upload Snyk SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif

      # --- 11) Build Docker Image (tag with commit SHA for traceability) ---
      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # --- 12) Scan Docker Image with Trivy (SARIF) ---
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          exit-code: ${{ env.ENFORCE_SECURITY == 'true' && '1' || '0' }}

      # --- 13) Upload Trivy SARIF to GitHub Security Tab ---
      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif

      # --- 14) Upload Trivy SARIF as artifact too ---
      - name: Upload Trivy SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif